<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="steam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2838" />
      <stop offset="50%" stop-color="#2a475e" />
      <stop offset="100%" stop-color="#171a21" />
    </linearGradient>
    <linearGradient id="steam-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66c0f4" />
      <stop offset="100%" stop-color="#1999e3" />
    </linearGradient>
    <linearGradient id="family-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="28" fill="url(#steam-grad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="rgba(102,192,244,0.3)" stroke-width="2" />

  <!-- Steam Piston / Connecting Rod -->
  <g transform="translate(64, 64) rotate(-35)">
    <!-- Arm connecting main pivot to secondary -->
    <path d="M 0,-6 L 36,-14 A 14,14 0 1,1 32,18 L -4,6 Z" fill="rgba(102,192,244,0.25)" />
    
    <!-- Large Main Drive Ring -->
    <circle cx="-16" cy="0" r="28" fill="none" stroke="url(#steam-accent)" stroke-width="8" filter="url(#glow)" />
    <circle cx="-16" cy="0" r="28" fill="none" stroke="url(#steam-accent)" stroke-width="8" />
    <circle cx="-16" cy="0" r="14" fill="#ffffff" opacity="0.9" />

    <!-- Connecting Rod -->
    <path d="M -16,0 L 26,18" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />
    
    <!-- Secondary Pivot / Family Hub -->
    <circle cx="26" cy="18" r="12" fill="url(#family-orange)" />
    <circle cx="26" cy="18" r="6" fill="#ffffff" />
  </g>
</svg>
